  <text x="600" y="75" text-anchor="middle" fill="#F4F7FA" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">BUILD CAREFULLY  ·  MEASURE HONESTLY  ·  LEARN CONTINUOUSLY</text>
  <text x="600" y="103" text-anchor="middle" fill="#9BB4C5" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3">ONE REPOSITORY AT A TIME</text>
