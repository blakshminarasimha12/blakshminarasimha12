<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Narasimha Reddy — Data to Decisions</title>
  <desc id="desc">A custom dark technical banner with a data-grid motif and a rising signal line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#172d3c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55D6BE"/>
      <stop offset="1" stop-color="#8AB4F8"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#9BB4C5" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="1030" cy="78" r="145" fill="#55D6BE" opacity=".06"/>
  <circle cx="1080" cy="310" r="190" fill="#8AB4F8" opacity=".06"/>
  <g fill="none" stroke="url(#line)" stroke-width="3" opacity=".85">
    <path d="M720 250 L790 250 L825 210 L865 230 L915 150 L955 180 L1000 112 L1040 138 L1090 80 L1150 80"/>
    <path d="M720 278 H1150" stroke-opacity=".22" stroke-width="1"/>
  </g>
  <g fill="#55D6BE">
    <circle cx="825" cy="210" r="5"/><circle cx="915" cy="150" r="5"/><circle cx="1000" cy="112" r="5"/><circle cx="1090" cy="80" r="5"/>
  </g>
  <text x="76" y="116" fill="#9BB4C5" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="5">PORTFOLIO / 2026</text>
  <text x="72" y="184" fill="#F4F7FA" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">NARASIMHA REDDY</text>
  <text x="76" y="232" fill="#55D6BE" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">DATA TO DECISIONS</text>
  <text x="76" y="278" fill="#C2D0DA" font-family="Arial, Helvetica, sans-serif" font-size="18">Python  /  Analytics  /  Machine Learning</text>
  <rect x="76" y="306" width="150" height="4" rx="2" fill="url(#line)"/>
